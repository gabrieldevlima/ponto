# Suíte de testes e verificações de conformidade.
# Fase 9.6 de docs/AUDITORIA_CONFORMIDADE_2026-08-05.md.
#
# Antes desta fase o único CI do projeto era o Lighthouse de acessibilidade
# (a11y.yml). Não havia verificação automática de sintaxe, de testes nem de
# vulnerabilidade em dependência — e a auditoria encontrou Dompdf com quatro
# CVEs, incluindo leitura de arquivo local, num sistema que usa Dompdf para
# gerar o comprovante de ponto.

name: Testes

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Sintaxe PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, openssl, iconv, mbstring
          coverage: none

      # Sintaxe de TODO arquivo PHP. Barato e pega o erro mais bobo antes de
      # qualquer outra coisa rodar.
      - name: php -l em todos os arquivos
        run: |
          erros=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::erro de sintaxe"
              php -l "$f" || true
              erros=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          exit $erros

  seguranca-dependencias:
    name: Vulnerabilidades em dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # Falha o build se houver advisory conhecido. É o controle que faltava:
      # a auditoria encontrou 15 advisories em produção, nenhum detectado.
      - name: composer audit
        run: composer audit --no-interaction

  testes:
    name: Suíte
    runs-on: ubuntu-latest

    # MariaDB, não MySQL: produção roda MariaDB 11.8 e as migrações usam sintaxe
    # que só existe nele — `ALTER TABLE ... ADD COLUMN IF NOT EXISTS` e
    # `CREATE INDEX IF NOT EXISTS`, em 16 arquivos. Contra MySQL, 41 das 73
    # migrações falhavam, o schema de teste nunca ficava pronto e 28 testes caíam
    # juntos por tabela inexistente — ruído que escondia qualquer falha real.
    # Um CI que não roda no mesmo motor da produção não prova o que interessa.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ponto_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, openssl, iconv, mbstring, gd
          tools: composer:v2
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist

      # Segredos de teste. NUNCA reutilizar as chaves de produção aqui — o
      # runner é efêmero e os valores aparecem no log de qualquer step que
      # imprima o ambiente.
      - name: Configuração local de teste
        run: |
          cat > config.local.php <<'PHP'
          <?php
          $servidor = '127.0.0.1';
          $usuario  = 'root';
          $senha    = 'root';
          $banco    = 'ponto_test';
          define('LEDGER_HMAC_KEY', str_repeat('a', 64));
          define('LEDGER_HMAC_KEY_ID', 'ci');
          define('BIOMETRIC_ENCRYPTION_KEY', base64_encode(str_repeat('b', 32)));
          PHP
          php -r '$kp = sodium_crypto_sign_keypair();
                  file_put_contents("config.local.php",
                    "define(\"LEDGER_SEAL_SECRET_KEY\", \"" . base64_encode(sodium_crypto_sign_secretkey($kp)) . "\");\n"
                    . "define(\"LEDGER_SEAL_KEY_ID\", \"ci\");\n", FILE_APPEND);'

      # Mesma collation padrão da produção. O container vem com o default do
      # MariaDB 11.8 (uca1400) e a produção roda em utf8mb4_unicode_ci; sem
      # alinhar, as conexões e o banco de teste se comportariam diferente.
      # `character_set_collations` fica no default de propósito — é igual ao da
      # produção, e é ele que faz tabela nova SEM `COLLATE` nascer em uca1400.
      # Deixá-lo igual é o que permite ao CI pegar esse erro numa migração nova.
      - name: Alinhar o servidor com a produção
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server     = 'utf8mb4_unicode_ci';
            ALTER DATABASE ponto_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      # O banco parte do schema REAL de produção (só estrutura, sem dado nenhum),
      # não de install.sql + as 73 migrações em ordem alfabética. Montar do zero
      # não reproduzia a produção: as legadas rodaram lá antes das datadas, uma
      # coluna foi removida e recriada fora da ordem dos nomes, e o CI acusava
      # falhas que não existem — escondendo as que existem. Ver
      # bin/schema_snapshot.php para regenerar.
      - name: Carregar o schema de produção
        run: |
          mysql -h 127.0.0.1 -uroot -proot ponto_test < sql/schema/producao.sql
          n=$(mysql -h 127.0.0.1 -uroot -proot -N -B ponto_test -e "SELECT COUNT(*) FROM applied_migrations;")
          echo "SNAPSHOT_MIGRACOES=$n" >> "$GITHUB_ENV"
          echo "schema de produção carregado; $n migrações já aplicadas lá"

      # `run_auto_migrations()` roda no primeiro require de config.php. Com o
      # snapshot, aplica SÓ o que ainda não está em produção — exatamente o que
      # o próximo deploy vai rodar.
      - name: Aplicar migrations pendentes
        run: php -r 'require "config.php"; echo "migrations aplicadas\n";'

      - name: Dados de referência
        run: mysql -h 127.0.0.1 -uroot -proot ponto_test < sql/seeds/ci_reference.sql

      # O sinal que importa. O runner registra a falha e segue — bom em produção,
      # ruim aqui. Toda migração que falhar neste passo vai falhar no deploy.
      - name: Conferir as migrações pendentes
        run: |
          falhas=$(mysql -h 127.0.0.1 -uroot -proot -N -B ponto_test -e "
            SELECT CONCAT(filename, ' — ', LEFT(failure_reason, 300))
              FROM applied_migrations WHERE failure_reason IS NOT NULL;")
          if [ -n "$falhas" ]; then
            echo "::error::migração falhou — vai falhar também no próximo deploy"
            echo "$falhas"
            exit 1
          fi
          total=$(mysql -h 127.0.0.1 -uroot -proot -N -B ponto_test -e "SELECT COUNT(*) FROM applied_migrations;")
          echo "$((total - SNAPSHOT_MIGRACOES)) migrações pendentes aplicadas sem erro"
      - name: PHPUnit
        run: php vendor/bin/phpunit --no-coverage

      # Verificações que não são "teste unitário", mas cujo resultado importa
      # tanto quanto: a cadeia do livro fiscal e os selos precisam fechar.
      - name: Integridade do livro fiscal
        run: |
          php bin/ledger_verify.php
          php bin/ledger_seal.php --audit
        continue-on-error: true
