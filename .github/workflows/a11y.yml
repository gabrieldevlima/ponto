# Lighthouse CI — auditoria de acessibilidade automática nas páginas admin.
#
# Roda em PRs que tocam código admin. Falha o build se o score de Acessibilidade
# cair abaixo de 90 ou se algum critério estrito (label, image-alt, html-has-lang,
# color-contrast, valid-lang) quebrar.
#
# Configuração de URLs/asserções está em ./lighthouserc.json.
#
# O próprio workflow sobe o que precisa: MariaDB como serviço e o servidor
# embutido do PHP em 127.0.0.1:8080, para onde as URLs do lighthouserc são
# reescritas antes do `lhci autorun`.

name: a11y (Lighthouse CI)

on:
  pull_request:
    paths:
      - "public/admin/**"
      - "helpers.php"
      - "lighthouserc.json"
  workflow_dispatch:

jobs:
  lhci:
    name: Auditoria de acessibilidade (admin)
    runs-on: ubuntu-latest

    # Mesmo motor da produção e do workflow de testes. Ver o comentário em
    # tests.yml: as migrações usam sintaxe que só existe no MariaDB.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ponto
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mbstring, gd, zip
          coverage: none

      # O PHP precisa apontar para o banco do runner. Sem isto, config.php usa o
      # nome do banco de produção e o servidor embutido não conecta em nada.
      - name: Configuração local de teste
        run: |
          cat > config.local.php <<'PHP'
          <?php
          $servidor = '127.0.0.1';
          $usuario  = 'root';
          $senha    = 'root';
          $banco    = 'ponto';
          PHP

      # Mesmo bootstrap do workflow de testes (ver comentários em tests.yml):
      # servidor na collation da produção, schema real de produção, migrações
      # pendentes, dados de referência e, por último, o seed do Lighthouse.
      # Antes o seed rodava sobre install.sql puro, sem as migrações, e morria
      # em "Unknown column 'name'" — admins.name nasce numa migração.
      - name: Alinhar o servidor com a produção
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server     = 'utf8mb4_unicode_ci';
            ALTER DATABASE ponto CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Carregar o schema de produção
        run: mysql -h 127.0.0.1 -uroot -proot ponto < sql/schema/producao.sql

      - name: Aplicar migrations pendentes
        run: php -r 'require "config.php"; echo "migrations aplicadas\n";'

      - name: Dados de referência e seed do Lighthouse
        run: |
          mysql -h 127.0.0.1 -uroot -proot ponto < sql/seeds/ci_reference.sql
          # Seed mínimo (1 admin + 1 escola + 1 colab) para autenticar páginas internas
          mysql -h 127.0.0.1 -uroot -proot ponto < sql/seeds/lhci_seed.sql
      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8080 -t public &
          sleep 2

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: |
          # Reescreve as URLs do lighthouserc para o servidor interno do CI.
          sed -i "s|http://localhost/ponto_ribeira/public|http://127.0.0.1:8080|g" lighthouserc.json
          lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
