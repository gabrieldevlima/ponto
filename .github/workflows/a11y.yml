# Lighthouse CI — auditoria de acessibilidade automática nas páginas admin.
#
# Roda em PRs que tocam código admin. Falha o build se o score de Acessibilidade
# cair abaixo de 90 ou se algum critério estrito (label, image-alt, html-has-lang,
# color-contrast, valid-lang) quebrar.
#
# Configuração de URLs/asserções está em ./lighthouserc.json.
#
# O próprio workflow sobe o que precisa: MariaDB como serviço e o servidor
# embutido do PHP em 127.0.0.1:8080, para onde as URLs do lighthouserc são
# reescritas antes do `lhci autorun`.

name: a11y (Lighthouse CI)

on:
  pull_request:
    paths:
      - "public/admin/**"
      - "helpers.php"
      - "lighthouserc.json"
  workflow_dispatch:

jobs:
  lhci:
    name: Auditoria de acessibilidade (admin)
    runs-on: ubuntu-latest

    # Mesmo motor da produção e do workflow de testes. Ver o comentário em
    # tests.yml: as migrações usam sintaxe que só existe no MariaDB.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ponto
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mbstring, gd, zip
          coverage: none

      # O PHP precisa apontar para o banco do runner. Sem isto, config.php usa o
      # nome do banco de produção e o servidor embutido não conecta em nada.
      - name: Configuração local de teste
        run: |
          cat > config.local.php <<'PHP'
          <?php
          $servidor = '127.0.0.1';
          $usuario  = 'root';
          $senha    = 'root';
          $banco    = 'ponto';
          PHP

      # install.sql sozinho cria só o schema base. O seed insere em colunas que
      # nascem nas migrações (admins.name, admins.cpf), então rodava antes da
      # hora e morria com "Unknown column 'name'" — e o `|| true` do install
      # escondia qualquer falha anterior a essa. Ordem correta: schema, migrações,
      # seed; e cada passo falha por conta própria.
      - name: Criar schema
        run: mysql -h 127.0.0.1 -uroot -proot ponto < sql/install/install.sql

      - name: Aplicar migrations
        run: php -r 'require "config.php"; echo "migrations aplicadas\n";'

      - name: Seed do Lighthouse
        run: |
          # Seed mínimo (1 admin + 1 escola + 1 colab) para autenticar páginas internas
          if [ -f sql/seeds/lhci_seed.sql ]; then
            mysql -h 127.0.0.1 -uroot -proot ponto < sql/seeds/lhci_seed.sql
          fi

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8080 -t public &
          sleep 2

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: |
          # Reescreve as URLs do lighthouserc para o servidor interno do CI.
          sed -i "s|http://localhost/ponto_ribeira/public|http://127.0.0.1:8080|g" lighthouserc.json
          lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
